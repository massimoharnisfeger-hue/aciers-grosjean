name: Project OS quality

on:
  # Le flux reel de ce depot est le push direct sur `main`, qui declenche le
  # deploiement Vercel de production. Sans ce declencheur, typecheck, build et
  # controles ne s'executaient sur aucun commit du chemin de production :
  # 69 commits, une seule branche, zero pull request.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      # Une dependance installee que personne n'appelle ne verifie rien :
      # `next build` saute silencieusement le lint quand eslint est absent.
      # L'etape est donc explicite. Controle par tests/test_lint.py.
      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Project OS tests
        run: python tests/test_project_os.py

      - name: Project OS and data checks
        run: python scripts/validation/project_os_check.py

      - name: Engineering Quality contract check
        run: python scripts/validation/engineering_quality_check.py

      - name: Engineering Quality tests
        run: python tests/test_engineering_quality.py

      - name: Extension checks
        run: python scripts/validation/extensions_check.py

      - name: Extension tests
        run: python tests/test_extensions.py

      # Gate : registre complet + invariant « le nombre de controles ne diminue
      # jamais ». Meme commande que le hook pre-commit local (scripts/hooks/).
      - name: Registre des controles
        run: python tests/lancer.py

      # Meme verificateur que le hook pre-commit local : une seule liste de
      # motifs pour les deux portes. Deux listes separees divergent toujours,
      # et c'est la plus permissive qui decide.
      - name: Secret scan
        run: git ls-files | python scripts/hooks/verifier-depot.py --secrets-seulement
