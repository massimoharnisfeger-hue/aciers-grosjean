name: Project OS quality

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Project OS tests
        run: python tests/test_project_os.py

      - name: Project OS and data checks
        run: python scripts/validation/project_os_check.py

      - name: Secret scan
        run: |
          if git grep -n -E -e '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|AKIA[0-9A-Z]{16}|sk_live_[0-9A-Za-z]+|gh[pousr]_[A-Za-z0-9_]{20,})' -- . ':(exclude)package-lock.json'; then
            echo 'Potential secret detected'
            exit 1
          fi
